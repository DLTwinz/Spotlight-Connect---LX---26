name: CI

on:
  push:
    branches: [main, spotlight-ui-align]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      # TODO: Re-enable a deterministic format check after Flutter/Dart versions
      # are pinned across developer environments and CI, and the production
      # source baseline is normalized in a dedicated formatting-only PR.

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: analyze

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Unit / widget tests
        run: flutter test

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: analyze

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Verify public Supabase build configuration
        shell: bash
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_PUBLISHABLE_KEY" || {
            echo "SUPABASE_PUBLISHABLE_KEY is required for release web builds."
            exit 1
          }

          case "$SUPABASE_PUBLISHABLE_KEY" in
            sb_secret_*|*service_role*)
              echo "Refusing to use a Supabase secret/service-role key in a client build."
              exit 1
              ;;
          esac

      - name: Build web (release)
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=https://mdwvokenmehdfybgujpa.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
